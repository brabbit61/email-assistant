# Non-secret tunables. Copy this file to config.toml and adjust:
#     cp config.example.toml config.toml
# config.toml is gitignored, so your live values never get committed.
# Secrets (API keys, tokens) live in secrets/.env — never here.

[models]
classifier = "claude-haiku-4-5-20251001" # per-email triage
agent = "claude-sonnet-5"                # hermes digests / chat / drafting
reviewer = "claude-sonnet-5"             # improvement-loop correction review

[budget]
monthly_usd_cap = 15.00   # informational — also set a hard cap in the Anthropic console
daily_usd_soft_cap = 0.75 # worker-enforced soft cap

[triage]
poll_interval_minutes = 5
# SAFE DEFAULT: classify every new email but never write a label to Gmail.
# Watch it for a few days (`assistant review`), then flip to false to go live.
# Full procedure: deploy/go-live.md.
dry_run = true
# When live, archive Low-Value mail out of the inbox. Off by default so a fresh
# install never removes mail from your inbox until you deliberately opt in.
auto_archive_low_value = false

[calendar]
# IANA timezone for calendar time-blocking. Naive timestamps in `assistant
# calendar` commands are interpreted as this zone. SET THIS TO YOUR OWN ZONE
# (e.g. "America/New_York", "Europe/London", "Asia/Kolkata").
timezone = "America/Los_Angeles"

[digest]
times = ["07:00", "13:00", "20:00"] # hermes digest schedule (host-local time)
