[project]
name = "email-assistant"
version = "0.1.0"
description = "Self-hosted Gmail triage: a deterministic AI labeling worker plus a guardrailed Telegram chat agent"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client",
    "google-auth-oauthlib",
    "anthropic",
]

[project.scripts]
assistant = "assistant.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pyyaml",
]

[tool.pytest.ini_options]
# Real-API fixtures (#15) are paid + flaky; keep them out of the default run.
# `pytest` excludes them; `pytest -m fixtures` (command-line -m wins) runs only them.
addopts = "-m 'not fixtures'"
markers = ["fixtures: real-API classifier fixtures (paid, opt-in; run with -m fixtures)"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "assistant"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I"]
