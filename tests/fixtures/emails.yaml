      and save. You're receiving this because you signed up for PyConf
      updates. Unsubscribe.

  - name: pri-bill-due-today
    expected_category: Bills
    expected_priority: P1-Urgent
    sender: City Water Dept <billing@citywater.example.gov>
    subject: FINAL NOTICE — your water bill is due TODAY
    body: |
      This is a final reminder that your water bill of $61.40 is due
