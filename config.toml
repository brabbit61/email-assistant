# Non-secret tunables (signed off in #6). Secrets live in secrets/.env — never here.

[models]
classifier = "claude-haiku-4-5-20251001" # per-email triage
agent = "claude-sonnet-5"                # hermes digests/chat/drafting
reviewer = "claude-sonnet-5"             # improvement-loop correction review (assistant propose)

[budget]
monthly_usd_cap = 15.00  # informational — enforced as a hard limit in the Anthropic console
daily_usd_soft_cap = 0.75 # worker-enforced from Phase 2

[triage]
poll_interval_minutes = 5
dry_run = false # go-live gate: worker classifies but never writes to Gmail. Flip to false after the T1.11 sign-off.
auto_archive_low_value = false # Phase 3 flips this on after the T1.11 go-live decision

[digest]
times = ["07:00", "13:00", "20:00"]
