[project]
name = "email-assistant"
version = "0.1.0"
description = "Personal Gmail triage worker + hermes-agent email assistant (see PLAN.md)"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client",
    "google-auth-oauthlib",
    "anthropic",
]

[project.scripts]
assistant = "assistant.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "assistant"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I"]
