      please pay immediately using the link below.

  - name: pri-flight-cancelled
    expected_category: Travel
    expected_priority: P1-Urgent
    sender: Delta Air Lines <alerts@delta.example.com>
    subject: Your flight DL1123 has been cancelled
    body: |
      We're sorry — your flight DL1123 scheduled for tomorrow morning
